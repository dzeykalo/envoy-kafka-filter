syntax = "proto3";

package kafkafilter;

import "validate/validate.proto";

message HttpToKafka {
  string bootstrap_servers = 1 [(validate.rules).string.min_bytes = 4];

  // If empty -> defaults are used.
  string action_header = 2; // default: "x-kafka-action"
  string topic_header  = 3; // default: "x-kafka-topic"

  // 0 = unlimited (filter-level)
  uint32 max_payload_bytes = 4;
}
